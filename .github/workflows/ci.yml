name: CI

# Run the full verification gate on every push and PR so no regression
# (type error, failing test, broken build, or lint warning) lands silently.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save free-tier minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Build-time placeholders so Next/Supabase client construction never throws
    # in CI. These are not secrets — real values are injected at deploy time.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # The ESLint flat config (eslint.config.mjs) lands in a separate PR.
        # Run lint only when it is present so branches without it aren't blocked.
        run: |
          if [ -f eslint.config.mjs ]; then
            npx eslint .
          else
            echo "eslint.config.mjs not present on this ref — skipping lint."
          fi

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
